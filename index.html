<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hummis Golf Challenge</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Clubhaus-Look: dunkles Clubgrün, Aperol-Orange als einziger Akzent. Eine Spalte, max 440px:
   Scorekarte oben, illustriertes Canvas-Spielfeld, Funk-Zeile mit Sprüchen. Anleitungen nur in Zwischenscreens. */
:root{
  color-scheme:dark;
  --bg:#10261c; --panel:#183829; --line:#2c5641; --fg:#f6efe0; --muted:#b6c9b8;
  --paper:#f7f0e1; --ink:#1d2a22; --aperol:#ff7a1a; --gold:#e8c46a;
  --display:"Yeseva One",Georgia,serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body,canvas,button,.ov{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas,button{touch-action:none}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#1f4a35 0,var(--bg) 60%);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;padding-left:16px;padding-right:16px;padding-top:12px;padding-bottom:12px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 14px;display:grid;grid-template-columns:1fr auto auto;gap:2px 12px;align-items:center}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.05}
.sub{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.pts{font-family:var(--display);font-size:26px;color:var(--aperol);text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.qbtn.off{opacity:.4;text-decoration:line-through}
.qbtn{width:40px;height:40px;border-radius:50%;padding:0;background:transparent;border:2px solid var(--line);color:var(--fg);font-family:var(--display);font-size:20px}
canvas#cv{width:100%;display:block;border-radius:18px;touch-action:none;background:#2d6b3f;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.radio{background:var(--panel);border-radius:12px;padding:10px 12px;font-weight:700;min-height:46px;border-left:4px solid var(--aperol)}
.radio b{color:var(--aperol)}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(6,16,11,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px 16px 16px 16px;z-index:5}
.ov .box{background:var(--paper);color:var(--ink);border-radius:22px;max-width:390px;width:100%;display:flex;flex-direction:column;max-height:94vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.ov canvas{width:100%;display:block;border-radius:22px 22px 0 0;aspect-ratio:320/150;flex-shrink:0}
.ov .inner{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
.kick{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--aperol)}
.ov h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.ov p{margin:0;color:#45574b}
.ov .big{font-family:var(--display);font-size:40px;color:var(--aperol);line-height:1}
.how{background:#ece2cc;border-radius:14px;padding:10px 12px}
.how h3{margin:0 0 6px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6b5d3e}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}
.ov ul{margin:0;padding:0;list-style:none;font-size:14px}
.dlg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(6,16,11,.78);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px 20px 16px;z-index:6;cursor:pointer}
.dbox{max-width:390px;width:100%;display:flex;flex-direction:column;gap:14px}
.dbox canvas{width:100%;display:block;border-radius:22px;aspect-ratio:320/200;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.bubble{position:relative;background:var(--paper);color:var(--ink);border-radius:20px;padding:14px 16px 12px;min-height:92px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:16px;line-height:1.4;font-weight:700}
.bubble::before{content:"";position:absolute;top:-12px;left:var(--tail,50%);transform:translateX(-50%);border:12px solid transparent;border-top:0;border-bottom-color:var(--paper)}
.bubble.narr{background:#24392d;color:var(--fg);font-style:italic;font-weight:600}
.bubble.narr::before{display:none}
.bubble b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--aperol);margin-bottom:2px;font-style:normal}
.dnext{font-size:12px;color:var(--muted);text-align:right;font-weight:800;margin-top:-6px}
.ov ul li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #cfc5ae;padding:5px 0;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:14px;background:var(--aperol);color:#fff;cursor:pointer;font-size:16px}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.ov button:focus-visible{outline-color:var(--ink)}

/* Switch / alte Browser */
.wrap>*+*{margin-top:10px}
.card{grid-gap:2px 12px}
.card>div:last-child>*+*{margin-left:8px}
.ov .inner>*+*{margin-top:10px}
.how ol>*+*{margin-top:4px}
.dbox>*+*{margin-top:14px}
.dnext{margin-top:-6px!important}
.ov ul li>*+*{margin-left:8px}
@media (min-aspect-ratio:4/3) and (min-width:800px){
  html,body{height:100%;overflow:hidden}
  body{padding:8px 14px;font-size:17px}
  .wrap{max-width:none;height:calc(100vh - 16px);display:grid;
    grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr;
    grid-template-areas:"feld info" "feld funk";grid-gap:12px;align-items:start}
  .wrap>*{margin:0!important}
  canvas#cv{grid-area:feld;width:calc((100vh - 16px) * 360 / 520)}
  .card{grid-area:info;max-width:520px}
  .radio{grid-area:funk;max-width:520px;font-size:19px}
  h1{font-size:32px}
  .pts{font-size:34px}
  .ov .box{max-width:620px;flex-direction:row}
  .ov .box>canvas{width:46%;border-radius:22px 0 0 22px;align-self:center}
  .ov .inner{flex:1}
}
</style>

<div class="wrap">
  <div class="card">
    <div><div class="sub" id="stTag">Clubturnier</div><h1 id="stTitle">Hummis Golf Challenge</h1></div>
    <div><div class="sub" style="text-align:right">Punkte</div><div class="pts" id="pts">0</div></div>
    <div style="display:flex;gap:8px"><button class="qbtn" id="sbtn" aria-label="Ton an oder aus">♪</button><button class="qbtn" id="qbtn" aria-label="Anleitung zeigen und pausieren">?</button></div>
  </div>
  <canvas id="cv" aria-label="Golfplatz"></canvas>
  <div class="radio" id="radio"><b>Golfclub-Funk:</b> Willkommen im Golfclub. Bitte keine Carts stehlen.</div>
</div>

<div class="dlg" id="dlg" hidden><div class="dbox"><canvas id="dcv" aria-hidden="true"></canvas><div class="bubble" id="bub"><b id="bwho"></b><span id="btxt"></span></div><div class="dnext" id="dnext">Tippen für weiter ▸</div></div></div>

<div class="ov" id="ov">
  <div class="box">
    <canvas id="art" aria-hidden="true"></canvas>
    <div class="inner">
      <div class="kick" id="ovK"></div>
      <h2 id="ovT">Hummis Golf Challenge</h2>
      <div class="big" id="ovBig" hidden></div>
      <p id="ovP"></p>
      <div class="how" id="ovHow" hidden><h3>So geht's</h3><ol id="ovHowList"></ol></div>
      <ul id="ovList" hidden></ul>
      <button id="ovBtn">Weiter</button>
    </div>
  </div>
</div>

function pt(e) {
